services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: dev-secret
DATABASE_URL: postgres://chat_api:chat_api@db:5432/chat_api?sslmode=disable
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat_api
      POSTGRES_PASSWORD: chat_api
      POSTGRES_DB: chat_api
    ports:
      - "5432:5432"
